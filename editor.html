<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hex Editor — West Marches style</title>
<style>
  :root{--bg:#10141a;--panel:#171c24;--panel2:#1f2630;--ink:#e8e6df;--muted:#8b94a3;--accent:#c9a24b;--border:#2a323d;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  .app{display:flex;height:100vh}
  /* canvas */
  .stage{flex:1;position:relative;overflow:auto;background:radial-gradient(circle at 50% 40%,#1a2029,#0b0e12)}
  #svgWrap{display:inline-block}
  svg{display:block}
  .hit{fill:transparent;stroke:transparent;stroke-width:3;pointer-events:all;cursor:crosshair}
  .hit:hover{stroke:#ffffffcc}
  .gridline{fill:none;stroke:#0008;stroke-width:1.5;pointer-events:none}
  /* panneau contextuel */
  .panel{width:240px;flex:0 0 240px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:16px 16px 12px}
  .panel h2{font-size:20px;margin:0 0 12px}
  .erase{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:12px;cursor:pointer}
  .erase input{width:16px;height:16px;accent-color:var(--accent)}
  .preview{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;cursor:pointer}
  .preview img{width:120px;height:120px;object-fit:contain}
  .preview .nm{font-size:14px;margin-top:6px}
  .preview .sub{font-size:11px;color:var(--muted)}
  .variants{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .variants img{width:34px;height:34px;object-fit:contain;background:#0004;border:2px solid transparent;border-radius:6px;cursor:pointer}
  .variants img.sel{border-color:var(--accent)}
  .opt{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:12px;cursor:pointer}
  .opt input{accent-color:var(--accent)}
  .hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}
  .spacer{flex:1}
  .footer{font-size:12px;color:var(--muted);line-height:1.4}
  .footer b{color:var(--ink)}
  button{background:var(--accent);color:#10141a;border:0;border-radius:7px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;width:100%}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--border);font-weight:500}
  button.danger{background:#c0584e;color:#fff;margin-top:8px}
  .pbtns{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  /* barre d'outils verticale */
  .toolbar{width:56px;flex:0 0 56px;background:#0c0f14;border-left:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
  .tbtn{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--accent);cursor:pointer;border:1px solid transparent;background:transparent;position:relative}
  .tbtn:hover{background:#ffffff10}
  .tbtn.active{background:#ffffff14;border-color:var(--accent)}
  .tbtn.disabled{color:#4a525e;cursor:not-allowed}
  .toolbar .spacer{flex:1;width:1px}
  /* modale catalogue */
  .modal{position:fixed;inset:0;background:#0b0e12ee;z-index:50;display:none;flex-direction:column;padding:18px 26px}
  .modal.open{display:flex}
  .modal .mhead{display:flex;align-items:center;gap:16px;margin-bottom:8px}
  .modal h2{margin:0;font-size:22px}
  .modal .msearch{flex:1}
  .modal .msearch input{width:100%;max-width:340px;background:var(--panel2);color:var(--ink);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:13px}
  .modal .close{margin-left:auto;font-size:26px;cursor:pointer;color:var(--muted);background:none;border:0;width:auto}
  .modal .mbody{overflow-y:auto;flex:1}
  .mgroup h3{font-size:17px;margin:18px 0 10px;color:var(--ink)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
  .card{position:relative;aspect-ratio:1;background:var(--panel2);border:2px solid var(--border);border-radius:9px;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .card:hover{border-color:#ffffff66}
  .card.sel{border-color:var(--accent)}
  .card img{width:100%;height:100%;object-fit:contain}
  .card .badge{position:absolute;top:4px;right:4px;background:#000a;color:#fff;font-size:10px;padding:1px 6px;border-radius:8px}
  .card .lbl{position:absolute;bottom:0;left:0;right:0;background:#000a;color:#fff;font-size:10px;padding:2px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#000d;padding:7px 16px;border-radius:20px;font-size:12px;z-index:60}
</style>
</head>
<body>
<div class="app">

  <!-- CANVAS -->
  <main class="stage"><div id="svgWrap"></div></main>

  <!-- PANNEAU CONTEXTUEL -->
  <aside class="panel" id="panel"></aside>

  <!-- BARRE D'OUTILS -->
  <nav class="toolbar" id="toolbar">
    <button class="tbtn" data-tool="tiles"   title="Tuiles">⬡</button>
    <button class="tbtn disabled" data-tool="roads"  title="Routes (à venir)">🛣</button>
    <button class="tbtn disabled" data-tool="rivers" title="Rivières (à venir)">〰</button>
    <button class="tbtn" data-tool="objects" title="Objets">🏠</button>
    <button class="tbtn disabled" data-tool="regions" title="Régions (à venir)">▣</button>
    <button class="tbtn disabled" data-tool="texts"  title="Textes (à venir)">🅣</button>
    <div class="spacer"></div>
    <button class="tbtn" id="gridBtn" title="Afficher/masquer la grille">▦</button>
  </nav>
</div>

<!-- MODALE CATALOGUE -->
<div class="modal" id="modal">
  <div class="mhead">
    <h2 id="modalTitle">Catalogue</h2>
    <div class="msearch"><input type="text" id="modalSearch" placeholder="Filtrer par nom…"></div>
    <button class="close" id="modalClose">×</button>
  </div>
  <div class="mbody" id="modalBody"></div>
</div>

<div class="toast" id="toast" style="display:none"></div>

<script src="catalog.js"></script>
<script>
"use strict";
const CAT = window.CATALOG || {tiles:[],objects:[]};

/* index id -> item */
const TILES_BY_ID = new Map(), OBJ_BY_ID = new Map();
for(const g of CAT.tiles) for(const it of g.items){ it._group=g.group; TILES_BY_ID.set(it.id,it); }
for(const g of CAT.objects) for(const it of g.items){ it._group=g.group; OBJ_BY_ID.set(it.id,it); }

/* ---- géométrie (identique au générateur, silhouette réelle) ---- */
const TILE_W=256, TILE_H=384, COL=256, ROW=192, XOFF=128, ANCHOR_Y=300;
const HEX_LOCAL=[[128,124],[256,191],[256,321],[128,383],[0,321],[0,191]];
const url = p => encodeURI(p);
const isFull = it => it.w===256 && it.h===384;
function tileXY(col,row){return {x:col*COL+((row&1)?XOFF:0), y:row*ROW};}
function hexPolyTile(tx,ty){return HEX_LOCAL.map(v=>(tx+v[0])+","+(ty+v[1])).join(" ");}

/* ---- état ---- */
const state = {
  cols:14, rows:11, zoom:0.42, showGrid:true,
  tool:"tiles", erase:false,
  cells:new Map(),            // "c,r" -> {terrain:{id,v}|null, objects:[{id,v}]}
  brushTile:null, tileVar:0,  // item + variante courante
  brushObj:null, objRandom:true,
};
const key=(c,r)=>c+","+r;

/* default brushes */
state.brushTile = CAT.tiles[0] && CAT.tiles[0].items[0];
state.brushObj  = CAT.objects[0] && CAT.objects[0].items[0];

/* =================== RENDU CANVAS =================== */
function terrainPath(t){const it=TILES_BY_ID.get(t.id); if(!it)return null; return it.variants[Math.min(t.v,it.variants.length-1)];}
function objItemVar(o){const it=OBJ_BY_ID.get(o.id); if(!it)return null; return {it, path:it.variants[Math.min(o.v,it.variants.length-1)]};}

function cellInner(c){
  if(!c) return "";
  let s="";
  if(c.terrain){ const p=terrainPath(c.terrain); if(p) s+=`<image href="${url(p)}" x="${c._tx}" y="${c._ty}" width="${TILE_W}" height="${TILE_H}"/>`; }
  for(const o of c.objects){
    const r=objItemVar(o); if(!r) continue;
    if(isFull(r.it)) s+=`<image href="${url(r.path)}" x="${c._tx}" y="${c._ty}" width="${TILE_W}" height="${TILE_H}"/>`;
    else { const x=(c._tx+128-r.it.w/2).toFixed(1), y=(c._ty+ANCHOR_Y-r.it.h).toFixed(1);
      s+=`<image href="${url(r.path)}" x="${x}" y="${y}" width="${r.it.w}" height="${r.it.h}"/>`; }
  }
  return s;
}
function render(){
  const vbW=state.cols*COL+XOFF, vbH=(state.rows-1)*ROW+TILE_H;
  let body="", grid="", hit="";
  for(let row=0;row<state.rows;row++) for(let col=0;col<state.cols;col++){
    const t=tileXY(col,row), k=key(col,row), c=state.cells.get(k);
    if(c){ c._tx=t.x; c._ty=t.y; }
    body+=`<g class="cell" data-k="${k}">${cellInner(c)}</g>`;
    if(state.showGrid) grid+=`<polygon class="gridline" points="${hexPolyTile(t.x,t.y)}"/>`;
    hit+=`<polygon class="hit" data-col="${col}" data-row="${row}" points="${hexPolyTile(t.x,t.y)}"/>`;
  }
  document.getElementById('svgWrap').innerHTML =
    `<svg id="svg" viewBox="0 0 ${vbW} ${vbH}" width="${(vbW*state.zoom)|0}" height="${(vbH*state.zoom)|0}">${body}${grid}${hit}</svg>`;
  bindCanvas();
}
function updateCell(col,row){
  const k=key(col,row), t=tileXY(col,row), c=state.cells.get(k);
  if(c){ c._tx=t.x; c._ty=t.y; }
  const g=document.querySelector(`g.cell[data-k="${CSS.escape(k)}"]`);
  if(g) g.innerHTML=cellInner(c); else render();
}

/* =================== PEINTURE =================== */
let painting=false, stroke=new Set();
function getCell(k,create){ let c=state.cells.get(k); if(!c && create){c={terrain:null,objects:[]};state.cells.set(k,c);} return c; }
function pruneCell(k){ const c=state.cells.get(k); if(c && !c.terrain && c.objects.length===0) state.cells.delete(k); }

function applyAt(col,row,isClick){
  const k=key(col,row);
  if(state.tool==="tiles"){
    if(state.erase){ const c=getCell(k); if(c){c.terrain=null;pruneCell(k);} }
    else {
      if(!state.brushTile) return;
      const c=getCell(k,true), n=state.brushTile.variants.length;
      c.terrain={id:state.brushTile.id, v: state.tileVar % n};   // pose la variante courante
      state.tileVar=(state.tileVar+1)%n;                          // … puis avance automatiquement
      refreshTilePreview();
    }
  } else if(state.tool==="objects"){
    if(state.erase){ const c=getCell(k); if(c){c.objects.pop();pruneCell(k);} }
    else {
      if(!state.brushObj) return;
      const c=getCell(k,true), n=state.brushObj.variants.length;
      const v = state.objRandom ? (Math.random()*n|0) : 0;
      c.objects.push({id:state.brushObj.id, v});
    }
  }
  updateCell(col,row); scheduleSave();
}
function clearCell(col,row){ state.cells.delete(key(col,row)); updateCell(col,row); scheduleSave(); }

function bindCanvas(){
  document.querySelectorAll('.hit').forEach(el=>{
    const col=+el.dataset.col, row=+el.dataset.row;
    el.addEventListener('mousedown',e=>{ if(e.button===2)return; e.preventDefault(); painting=true; stroke=new Set([col+','+row]); applyAt(col,row,true); });
    el.addEventListener('mouseover',()=>{ if(painting && !stroke.has(col+','+row)){ stroke.add(col+','+row); applyAt(col,row,false); } });
    el.addEventListener('contextmenu',e=>{ e.preventDefault(); clearCell(col,row); });
  });
}
window.addEventListener('mouseup',()=>painting=false);

/* =================== PANNEAUX =================== */
function renderPanel(){
  const p=document.getElementById('panel');
  const footer=`<div class="spacer"></div><div class="footer"><b>Hex Editor</b><br>Construis ta carte à la main.<br>Clic = poser · glisser = peindre · clic droit = vider la case.</div>
    <div class="pbtns"><button class="ghost" id="saveBtn">⤓ Enregistrer (.json)</button><button class="ghost" id="loadBtn">⤒ Charger</button>
    <button class="ghost" id="pngBtn">⤓ Export PNG</button><a href="index.html" style="text-decoration:none"><button class="ghost" style="margin-top:6px">← Générateur</button></a>
    <button class="danger" id="clearBtn">🗑 Tout effacer</button></div>`;
  if(state.tool==="tiles"){
    const it=state.brushTile;
    p.innerHTML=`<h2>Tuiles</h2>
      <label class="erase"><input type="checkbox" id="eraseChk" ${state.erase?'checked':''}> ◇ Gomme</label>
      <div class="preview" id="catOpen">
        ${it?`<img id="tilePrevImg" src="${url(it.variants[Math.min(state.tileVar,it.variants.length-1)])}"><div class="nm">${it.name}</div><div class="sub">${it._group}${it.variants.length>1?' · ×'+it.variants.length+' variantes':''}</div>`:'<div class="sub">Aucune tuile</div>'}
      </div>
      <div class="hint">Clique l'aperçu pour ouvrir le catalogue. Chaque clic sur la carte pose une variante puis passe automatiquement à la suivante (l'aperçu change).</div>
      ${footer}`;
    document.getElementById('catOpen').onclick=()=>openCatalog('tiles');
  } else if(state.tool==="objects"){
    const it=state.brushObj;
    let vthumbs="";
    if(it && it.variants.length>1) vthumbs=`<div class="variants">${it.variants.map((v,i)=>`<img src="${url(v)}" title="variante ${i+1}">`).join("")}</div>`;
    p.innerHTML=`<h2>Objets</h2>
      <label class="erase"><input type="checkbox" id="eraseChk" ${state.erase?'checked':''}> ◇ Gomme</label>
      <div class="preview" id="catOpen">
        ${it?`<img src="${url(it.variants[0])}"><div class="nm">${it.name}</div><div class="sub">${it._group}${it.variants.length>1?' · ×'+it.variants.length:''}</div>`:'<div class="sub">Aucun objet</div>'}
      </div>
      ${vthumbs}
      <label class="opt"><input type="checkbox" id="randChk" ${state.objRandom?'checked':''}> ⤬ Variante aléatoire</label>
      <div class="hint">Les objets se posent par-dessus le terrain et s'empilent. Gomme = retire le dernier objet.</div>
      ${footer}`;
    document.getElementById('catOpen').onclick=()=>openCatalog('objects');
    const rc=document.getElementById('randChk'); if(rc) rc.onchange=e=>state.objRandom=e.target.checked;
  }
  const ec=document.getElementById('eraseChk'); if(ec) ec.onchange=e=>state.erase=e.target.checked;
  document.getElementById('saveBtn').onclick=saveMap;
  document.getElementById('loadBtn').onclick=loadMap;
  document.getElementById('pngBtn').onclick=exportPNG;
  document.getElementById('clearBtn').onclick=()=>{ if(confirm("Tout effacer ?")){state.cells.clear();render();scheduleSave();} };
}

/* =================== CATALOGUE (MODALE) =================== */
let catalogMode="tiles";
function openCatalog(mode){
  catalogMode=mode;
  document.getElementById('modalTitle').textContent = mode==="tiles"?"Tile Catalog":"Object Catalog";
  document.getElementById('modalSearch').value="";
  renderCatalog("");
  document.getElementById('modal').classList.add('open');
}
function renderCatalog(q){
  q=(q||"").toLowerCase();
  const groups = catalogMode==="tiles"?CAT.tiles:CAT.objects;
  const selId = catalogMode==="tiles"?(state.brushTile&&state.brushTile.id):(state.brushObj&&state.brushObj.id);
  let html="";
  for(const g of groups){
    const items=g.items.filter(it=>!q || it.name.toLowerCase().includes(q) || it.id.toLowerCase().includes(q));
    if(!items.length) continue;
    html+=`<div class="mgroup"><h3>${g.group}</h3><div class="cards">`;
    for(const it of items){
      html+=`<div class="card${it.id===selId?' sel':''}" data-id="${it.id}" title="${it.name} (${it.w}×${it.h})">
        <img loading="lazy" src="${url(it.variants[0])}">
        ${it.variants.length>1?`<span class="badge">×${it.variants.length}</span>`:''}
        <span class="lbl">${it.name}</span></div>`;
    }
    html+=`</div></div>`;
  }
  const body=document.getElementById('modalBody'); body.innerHTML=html||'<p style="color:var(--muted)">Aucun résultat.</p>';
  body.querySelectorAll('.card').forEach(el=>el.onclick=()=>pickFromCatalog(el.dataset.id));
}
function pickFromCatalog(id){
  if(catalogMode==="tiles"){ state.brushTile=TILES_BY_ID.get(id); state.tileVar=0; }
  else { state.brushObj=OBJ_BY_ID.get(id); }
  document.getElementById('modal').classList.remove('open');
  renderPanel();
}
document.getElementById('modalClose').onclick=()=>document.getElementById('modal').classList.remove('open');
document.getElementById('modalSearch').oninput=e=>renderCatalog(e.target.value);
document.getElementById('modal').addEventListener('mousedown',e=>{ if(e.target.id==='modal') document.getElementById('modal').classList.remove('open'); });

/* =================== OUTILS / UI =================== */
function setTool(t){
  if(['roads','rivers','regions','texts'].includes(t)){ toast("« "+t+" » arrive bientôt"); return; }
  state.tool=t; state.erase=false;
  document.querySelectorAll('.tbtn[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
  renderPanel();
}
document.querySelectorAll('.tbtn[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
document.getElementById('gridBtn').onclick=()=>{ state.showGrid=!state.showGrid; document.getElementById('gridBtn').classList.toggle('active',state.showGrid); render(); };
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1500);}
function refreshTilePreview(){ const im=document.getElementById('tilePrevImg'); if(im&&state.brushTile) im.src=url(state.brushTile.variants[state.tileVar%state.brushTile.variants.length]); }

/* zoom molette */
document.querySelector('.stage').addEventListener('wheel',e=>{ if(!e.ctrlKey && !e.metaKey && !e.shiftKey) return; e.preventDefault();
  state.zoom = Math.max(0.12, Math.min(2, state.zoom*(e.deltaY<0?1.12:0.9))); render(); }, {passive:false});

/* =================== PERSISTANCE =================== */
function serialize(){
  const cells=[];
  for(const [k,c] of state.cells) cells.push([k,{t:c.terrain?[c.terrain.id,c.terrain.v]:null, o:c.objects.map(o=>[o.id,o.v])}]);
  return {cols:state.cols,rows:state.rows,cells};
}
function deserialize(d){
  state.cols=d.cols||14; state.rows=d.rows||11; state.cells=new Map();
  for(const [k,c] of (d.cells||[])){
    const terrain = c.t && TILES_BY_ID.has(c.t[0]) ? {id:c.t[0],v:c.t[1]||0} : null;
    const objects = (c.o||[]).filter(o=>OBJ_BY_ID.has(o[0])).map(o=>({id:o[0],v:o[1]||0}));
    state.cells.set(k,{terrain,objects});
  }
  render();
}
let saveTimer=null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{try{localStorage.setItem('hexeditor2',JSON.stringify(serialize()));}catch(e){}},400); }
function saveMap(){
  const blob=new Blob([JSON.stringify(serialize())],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hexmap.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast("Carte enregistrée ✓");
}
function loadMap(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const fr=new FileReader();
    fr.onload=()=>{ try{deserialize(JSON.parse(fr.result));scheduleSave();toast("Chargée ✓");}catch(e){toast("Fichier invalide");} }; fr.readAsText(f); };
  inp.click();
}
function exportPNG(){
  const svgEl=document.getElementById('svg'); if(!svgEl)return;
  const vb=svgEl.getAttribute('viewBox').split(' ').map(Number), w=vb[2], h=vb[3];
  const clone=svgEl.cloneNode(true); clone.querySelectorAll('.hit,.gridline').forEach(n=>n.remove());
  clone.setAttribute('width',w); clone.setAttribute('height',h); clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const bg=document.createElementNS('http://www.w3.org/2000/svg','rect'); bg.setAttribute('width',w);bg.setAttribute('height',h);bg.setAttribute('fill','#10141a'); clone.insertBefore(bg,clone.firstChild);
  const data=new XMLSerializer().serializeToString(clone), img=new Image();
  img.onload=()=>{ const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0);
    try{cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hexmap.png';a.click();},'image/png');toast("PNG exporté ✓");}
    catch(e){toast("Export bloqué en file:// (serveur local requis)");} };
  img.onerror=()=>toast("Export PNG indisponible en file:// (tuiles externes)");
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(data);
}

/* =================== INIT =================== */
setTool('tiles');
document.getElementById('gridBtn').classList.add('active');
const saved=localStorage.getItem('hexeditor2');
if(saved){ try{deserialize(JSON.parse(saved));}catch(e){render();} } else render();
</script>
</body>
</html>
