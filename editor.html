<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hex Editor - West Marches style</title>
    <style>
      :root {
        --bg: #10141a;
        --panel: #171c24;
        --panel2: #1f2630;
        --ink: #e8e6df;
        --muted: #8b94a3;
        --accent: #c9a24b;
        --border: #2a323d;
        --wm-gradient-inner: #33404f;
        --wm-gradient-outer: #232b35;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
        overflow: hidden;
      }
      .app {
        display: flex;
        height: 100vh;
      }
      /* canvas */
      .stage {
        flex: 1;
        position: relative;
        overflow: auto;
        background-color: #2b3440;
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE/Edge */
      }
      .stage::-webkit-scrollbar {
        display: none; /* Chrome/Safari */
      }
      #svgWrap {
        display: inline-block;
      }
      svg {
        display: block;
      }
      .hit {
        fill: transparent;
        stroke: transparent;
        stroke-width: 3;
        pointer-events: all;
        cursor: crosshair;
      }
      .hit:hover {
        stroke: rgba(247, 242, 217, 0.47);
      }
      .gridline {
        fill: none;
        stroke: #0008;
        stroke-width: 1.5;
        pointer-events: none;
      }
      .gridline.pad {
        stroke: #00000029;
      }
      #ghost {
        opacity: 0.5;
        pointer-events: none;
      }
      .stage.pan-ready {
        cursor: grab;
      }
      .stage.panning {
        cursor: grabbing;
      }
      .stage.pan-ready .hit,
      .stage.panning .hit {
        pointer-events: none;
      }
      /* panneau contextuel */
      .panel {
        width: 240px;
        flex: 0 0 240px;
        background: var(--panel);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 16px 16px 12px;
        overflow: hidden;
        transition:
          flex-basis 0.18s ease,
          width 0.18s ease,
          padding 0.18s ease;
      }
      .panel.collapsed {
        flex-basis: 0;
        width: 0;
        padding-left: 0;
        padding-right: 0;
        border-left-color: transparent;
      }
      .panel h2 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      .erase {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        margin-bottom: 12px;
        cursor: pointer;
      }
      .erase input {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }
      .preview {
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        text-align: center;
        cursor: pointer;
      }
      .preview img {
        width: 120px;
        height: 120px;
        object-fit: contain;
      }
      .preview .nm {
        font-size: 14px;
        margin-top: 6px;
      }
      .preview .sub {
        font-size: 11px;
        color: var(--muted);
      }
      .variants {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 10px;
      }
      .variants img {
        width: 34px;
        height: 34px;
        object-fit: contain;
        background: #0004;
        border: 2px solid transparent;
        border-radius: 6px;
        cursor: pointer;
      }
      .variants img.sel {
        border-color: var(--accent);
      }
      .opt {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        margin-top: 12px;
        cursor: pointer;
      }
      .opt input {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        accent-color: var(--accent);
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
        margin-top: 10px;
      }
      .spacer {
        flex: 1;
      }
      .footer {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.4;
      }
      .footer b {
        color: var(--ink);
      }
      button {
        background: var(--accent);
        color: #10141a;
        border: 0;
        border-radius: 7px;
        padding: 9px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }
      .ic {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      button.ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--border);
        font-weight: 500;
      }
      button.danger {
        background: #c0584e;
        color: #fff;
        margin-top: 8px;
      }
      .pbtns {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 10px;
      }
      /* barre d'outils verticale */
      .toolbar {
        width: 56px;
        flex: 0 0 56px;
        background: #0c0f14;
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 14px 0;
        gap: 6px;
      }
      .tbtn {
        width: 40px;
        height: 40px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
        color: var(--accent);
        cursor: pointer;
        border: 1px solid transparent;
        background: transparent;
        position: relative;
      }
      .tbtn svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tbtn:hover {
        background: #ffffff10;
      }
      .tbtn.active {
        background: #ffffff14;
        border-color: var(--accent);
      }
      .tbtn.disabled {
        color: #4a525e;
        cursor: not-allowed;
      }
      .toolbar .spacer {
        flex: 1;
        width: 1px;
      }
      .toolbar .tdiv {
        width: 24px;
        height: 1px;
        background: var(--border);
        margin: 2px 0;
        flex: 0 0 auto;
      }
      #panelToggle svg {
        transition: transform 0.18s ease;
      }
      #panelToggle.flipped svg {
        transform: rotate(180deg);
      }
      /* menu réglages (popover) */
      .settings-menu {
        position: fixed;
        right: 64px;
        bottom: 14px;
        width: 212px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px;
        display: none;
        flex-direction: column;
        gap: 6px;
        z-index: 40;
        box-shadow: 0 10px 30px #000a;
      }
      .settings-menu.open {
        display: flex;
      }
      .settings-menu .sm-title {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 2px 2px 4px;
      }
      .settings-menu .sm-dims {
        display: flex;
        gap: 8px;
        margin-bottom: 6px;
      }
      .settings-menu .sm-dims label {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 11px;
        color: var(--muted);
      }
      .settings-menu .sm-dims input {
        width: 100%;
        background: var(--panel2);
        color: var(--ink);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px;
        font-size: 13px;
      }
      .settings-menu hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 4px 0;
      }
      /* modale catalogue */
      .modal {
        position: fixed;
        inset: 0;
        background: #0b0e12ee;
        z-index: 50;
        display: none;
        flex-direction: column;
        padding: 18px 26px;
      }
      .modal.open {
        display: flex;
      }
      .modal .mhead {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 8px;
      }
      .modal h2 {
        margin: 0;
        font-size: 22px;
      }
      .modal .msearch {
        flex: 1;
      }
      .modal .msearch input {
        width: 100%;
        max-width: 340px;
        background: var(--panel2);
        color: var(--ink);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 7px 10px;
        font-size: 13px;
      }
      .modal .close {
        margin-left: auto;
        font-size: 26px;
        cursor: pointer;
        color: var(--muted);
        background: none;
        border: 0;
        width: auto;
      }
      .modal .mbody {
        overflow-y: auto;
        flex: 1;
      }
      .mgroup h3 {
        font-size: 17px;
        margin: 18px 0 10px;
        color: var(--ink);
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 10px;
      }
      .card {
        position: relative;
        aspect-ratio: 1;
        background: var(--panel2);
        border: 2px solid var(--border);
        border-radius: 9px;
        cursor: pointer;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card:hover {
        border-color: #ffffff66;
      }
      .card.sel {
        border-color: var(--accent);
      }
      .card img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .card .badge {
        position: absolute;
        top: 4px;
        right: 4px;
        background: #000a;
        color: #fff;
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 8px;
      }
      .card .lbl {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: #000a;
        color: #fff;
        font-size: 10px;
        padding: 2px 4px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* popover d'aperçu des variantes au hover */
      .vpop {
        position: fixed;
        z-index: 60;
        display: none;
        padding: 10px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 10px 30px #000a;
        pointer-events: none; /* ne vole pas le hover de la card */
      }
      .vpop.show {
        display: block;
      }
      .vpop .vgrid {
        display: grid;
        grid-template-columns: repeat(4, 44px);
        gap: 8px;
      }
      .vpop .vgrid img,
      .vpop .vmore {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        background: #0004;
      }
      .vpop .vgrid img {
        object-fit: contain;
      }
      .vpop .vmore {
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }
      .toast {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: #000d;
        padding: 7px 16px;
        border-radius: 20px;
        font-size: 12px;
        z-index: 60;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- CANVAS -->
      <main class="stage"><div id="svgWrap"></div></main>

      <!-- PANNEAU CONTEXTUEL -->
      <aside class="panel" id="panel"></aside>

      <!-- BARRE D'OUTILS -->
      <nav class="toolbar" id="toolbar">
        <button class="tbtn" data-tool="tiles" title="Tuiles">
          <svg viewBox="0 0 24 24">
            <path
              d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
            />
          </svg>
        </button>
        <button class="tbtn" data-tool="roads" title="Routes">
          <svg viewBox="0 0 24 24">
            <circle cx="6" cy="19" r="3" />
            <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" />
            <circle cx="18" cy="5" r="3" />
          </svg>
        </button>
        <button class="tbtn" data-tool="rivers" title="Rivières">
          <svg viewBox="0 0 24 24">
            <path d="M2 6q2.5 2 5 0t5 0 5 0 5 0" />
            <path d="M2 12q2.5 2 5 0t5 0 5 0 5 0" />
            <path d="M2 18q2.5 2 5 0t5 0 5 0 5 0" />
          </svg>
        </button>
        <button class="tbtn" data-tool="objects" title="Objets">
          <svg viewBox="0 0 24 24">
            <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
            <path
              d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
            />
          </svg>
        </button>
        <button
          class="tbtn disabled"
          data-tool="regions"
          title="Régions (à venir)"
        >
          <svg viewBox="0 0 24 24">
            <path
              d="M8.3 10a.7.7 0 0 1-.626-1.079L11.4 3a.7.7 0 0 1 1.198-.043L16.3 8.9a.7.7 0 0 1-.572 1.1Z"
            />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <circle cx="17.5" cy="17.5" r="3.5" />
          </svg>
        </button>
        <div class="spacer"></div>
        <button class="tbtn" id="gridBtn" title="Afficher/masquer la grille">
          <svg viewBox="0 0 24 24">
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M3 9h18" />
            <path d="M3 15h18" />
            <path d="M9 3v18" />
            <path d="M15 3v18" />
          </svg>
        </button>
        <button class="tbtn" id="settingsBtn" title="Réglages">
          <svg viewBox="0 0 24 24">
            <path
              d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
        <div class="tdiv"></div>
        <button
          class="tbtn"
          id="panelToggle"
          title="Replier / déplier le panneau"
        >
          <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
        </button>
      </nav>
    </div>

    <!-- MENU RÉGLAGES -->
    <div class="settings-menu" id="settingsMenu"></div>

    <!-- MODALE CATALOGUE -->
    <div class="modal" id="modal">
      <div class="mhead">
        <h2 id="modalTitle">Catalogue</h2>
        <div class="msearch">
          <input type="text" id="modalSearch" placeholder="Filtrer par nom…" />
        </div>
        <button class="close" id="modalClose">×</button>
      </div>
      <div class="mbody" id="modalBody"></div>
    </div>

    <div class="toast" id="toast" style="display: none"></div>

    <script src="catalog.js"></script>
    <script>
      "use strict";
      const CAT = window.CATALOG || { tiles: [], objects: [] };

      /* déduplique les variantes pointant vers le même visuel (même nom de fichier,
         ex. hexPlains00.png présent dans deux packs) pour éviter les répétitions */
      function dedupeVariants(it) {
        const seen = new Set(),
          out = [];
        for (const v of it.variants) {
          const base = v.split("/").pop().toLowerCase();
          if (!seen.has(base)) {
            seen.add(base);
            out.push(v);
          }
        }
        it.variants = out;
      }

      /* index id -> item */
      const TILES_BY_ID = new Map(),
        OBJ_BY_ID = new Map();
      for (const g of CAT.tiles)
        for (const it of g.items) {
          it._group = g.group;
          dedupeVariants(it);
          TILES_BY_ID.set(it.id, it);
        }
      for (const g of CAT.objects)
        for (const it of g.items) {
          it._group = g.group;
          dedupeVariants(it);
          OBJ_BY_ID.set(it.id, it);
        }

      /* ---- géométrie (identique au générateur, silhouette réelle) ---- */
      const TILE_W = 256,
        TILE_H = 384,
        COL = 256,
        ROW = 192,
        XOFF = 128,
        ANCHOR_Y = 300;
      const HEX_LOCAL = [
        [128, 124],
        [256, 191],
        [256, 316],
        [128, 383],
        [0, 316],
        [0, 191],
      ];
      const url = (p) => encodeURI(p);
      const isFull = (it) => it.w === 256 && it.h === 384;
      const PAD = 16; // marge de grille non-cliquable autour de la zone active (canvas "infini")
      function tileXY(col, row) {
        return { x: col * COL + (row & 1 ? XOFF : 0), y: row * ROW };
      }
      function hexPolyTile(tx, ty) {
        return HEX_LOCAL.map((v) => tx + v[0] + "," + (ty + v[1])).join(" ");
      }

      /* ---- état ---- */
      const state = {
        cols: 60,
        rows: 44,
        zoom: 0.42,
        showGrid: true,
        tool: "tiles",
        erase: false,
        cells: new Map(), // "c,r" -> {terrain:{id,v}|null, objects:[{id,v}]}
        brushTile: null,
        tileVar: 0, // item + variante courante
        brushObj: null,
        objRandom: true,
        objVar: 0, // variante d'objet choisie manuellement (si objRandom = false)
        roadAuto: true, // routes : tracé auto-connecté (défaut) vs pose manuelle d'une pièce du catalogue
        roadBrush: null, // pièce de route choisie en mode manuel : { mask, bridge }
        riverAuto: true, // idem pour les rivières
        riverBrush: null, // pièce de rivière choisie en mode manuel : { mask, bridge:false }
      };
      const key = (c, r) => c + "," + r;

      /* default brushes */
      state.brushTile = CAT.tiles[0] && CAT.tiles[0].items[0];
      state.brushObj = CAT.objects[0] && CAT.objects[0].items[0];
      if (state.brushTile && state.brushTile.variants.length > 1)
        state.tileVar = (Math.random() * state.brushTile.variants.length) | 0; // démarre le cycle au hasard

      /* =================== RENDU CANVAS =================== */
      function terrainPath(t) {
        const it = TILES_BY_ID.get(t.id);
        if (!it) return null;
        return it.variants[Math.min(t.v, it.variants.length - 1)];
      }
      function objItemVar(o) {
        const it = OBJ_BY_ID.get(o.id);
        if (!it) return null;
        return { it, path: it.variants[Math.min(o.v, it.variants.length - 1)] };
      }

      /* ---- socle 2.5D sous les tuiles (Under Dirt / Under Ocean) ---- */
      const UNDER_DY = 316, // décalage vertical : pose le chevron du socle sur le V bas de l'hex
        UNDER_W = 256,
        UNDER_H = 192;
      // chemins en dur : ces tuiles (256x192) ne sont pas dans le catalogue placeable
      const UNDER_BASE = "assets/tiles/under-tiles/";
      const UNDER_DIRT = UNDER_BASE + "hexUnderDirt00.png",
        UNDER_OCEAN = UNDER_BASE + "hexUnderOcean00.png";
      // socle adapté à la tuile via son champ "under" (ocean | dirt | none), fixé par build_catalog
      function underFor(terrain) {
        const it = TILES_BY_ID.get(terrain.id);
        if (!it || it.under === "none") return null;
        return it.under === "ocean" ? UNDER_OCEAN : UNDER_DIRT;
      }

      function cellInner(c) {
        if (!c) return "";
        let s = "";
        if (c.terrain) {
          const p = terrainPath(c.terrain);
          if (p) {
            const u = underFor(c.terrain);
            if (u)
              s += `<image href="${url(u)}" x="${c._tx}" y="${c._ty + UNDER_DY}" width="${UNDER_W}" height="${UNDER_H}"/>`;
            s += `<image href="${url(p)}" x="${c._tx}" y="${c._ty}" width="${TILE_W}" height="${TILE_H}"/>`;
          }
        }
        // routes / rivières : tuile d'arêtes plein-hex, au-dessus du terrain, sous les objets
        if (c.road) {
          const map = c.roadBridge ? BRIDGE_TILE : ROAD_TILE;
          const p = edgeTilePath(map, c.road, c._col, c._row);
          if (p)
            s += `<image href="${url(p)}" x="${c._tx}" y="${c._ty}" width="${TILE_W}" height="${TILE_H}"/>`;
        }
        if (c.river) {
          const p = edgeTilePath(RIVER_TILE, c.river, c._col, c._row);
          if (p)
            s += `<image href="${url(p)}" x="${c._tx}" y="${c._ty}" width="${TILE_W}" height="${TILE_H}"/>`;
        }
        for (const o of c.objects) {
          const r = objItemVar(o);
          if (!r) continue;
          if (isFull(r.it))
            s += `<image href="${url(r.path)}" x="${c._tx}" y="${c._ty}" width="${TILE_W}" height="${TILE_H}"/>`;
          else {
            const ox = o.ox != null ? o.ox : 128,
              oy = o.oy != null ? o.oy : ANCHOR_Y; // ox/oy = point d'ancrage (base-centre) du tampon
            const x = (c._tx + ox - r.it.w / 2).toFixed(1),
              y = (c._ty + oy - r.it.h).toFixed(1);
            s += `<image href="${url(r.path)}" x="${x}" y="${y}" width="${r.it.w}" height="${r.it.h}"/>`;
          }
        }
        return s;
      }
      function render() {
        const c0 = -PAD,
          c1 = state.cols - 1 + PAD,
          r0 = -PAD,
          r1 = state.rows - 1 + PAD;
        const vbX = c0 * COL,
          vbY = r0 * ROW;
        const vbW = c1 * COL + XOFF + TILE_W - vbX,
          vbH = r1 * ROW + TILE_H - vbY;
        state._vb = { x: vbX, y: vbY, w: vbW, h: vbH }; // mémorisé pour le zoom (évite de tout reconstruire)
        let body = "",
          grid = "",
          hit = "";
        for (let row = r0; row <= r1; row++)
          for (let col = c0; col <= c1; col++) {
            const t = tileXY(col, row);
            const active =
              col >= 0 && col < state.cols && row >= 0 && row < state.rows;
            if (active) {
              const k = key(col, row),
                c = state.cells.get(k);
              if (c) {
                c._tx = t.x;
                c._ty = t.y;
                c._col = col;
                c._row = row;
              }
              body += `<g class="cell" data-k="${k}">${cellInner(c)}</g>`;
              if (state.showGrid)
                grid += `<polygon class="gridline" data-gk="${k}" points="${hexPolyTile(t.x, t.y)}"${c && c.terrain ? ' style="display:none"' : ""}/>`;
              hit += `<polygon class="hit" data-col="${col}" data-row="${row}" points="${hexPolyTile(t.x, t.y)}"/>`;
            } else if (state.showGrid) {
              // marge : grille visible mais non-cliquable (pas de placement)
              grid += `<polygon class="gridline pad" points="${hexPolyTile(t.x, t.y)}"/>`;
            }
          }
        document.getElementById("svgWrap").innerHTML =
          `<svg id="svg" viewBox="${vbX} ${vbY} ${vbW} ${vbH}" width="${(vbW * state.zoom) | 0}" height="${(vbH * state.zoom) | 0}">${grid}${body}<g id="ghost"></g>${hit}</svg>`;
        bindCanvas();
      }
      function updateCell(col, row) {
        const k = key(col, row),
          t = tileXY(col, row),
          c = state.cells.get(k);
        if (c) {
          c._tx = t.x;
          c._ty = t.y;
          c._col = col;
          c._row = row;
        }
        const g = document.querySelector(`g.cell[data-k="${CSS.escape(k)}"]`);
        if (g) g.innerHTML = cellInner(c);
        else render();
        const gl = document.querySelector(
          `polygon.gridline[data-gk="${CSS.escape(k)}"]`,
        );
        if (gl) gl.style.display = c && c.terrain ? "none" : "";
      }

      /* =================== ROUTES / RIVIÈRES (tuiles d'arêtes en overlay) ===================
         Chaque hex traversé stocke un masque 6 bits (c.road / c.river) ; on affiche la
         tuile correspondante (hexRoad-<masque>-<v>.png), dont les amorces rejoignent les
         arêtes -> route/rivière continue et texturée, comme la vraie feature.
         bit0=W bit1=SW bit2=SE bit3=E bit4=NE bit5=NW   |   opposé = (bit+3)%6           */
      const DIRS = [
        { even: [-1, 0], odd: [-1, 0] }, // 0 W
        { even: [-1, 1], odd: [0, 1] }, // 1 SW
        { even: [0, 1], odd: [1, 1] }, // 2 SE
        { even: [1, 0], odd: [1, 0] }, // 3 E
        { even: [0, -1], odd: [1, -1] }, // 4 NE
        { even: [-1, -1], odd: [0, -1] }, // 5 NW
      ];
      function neighbor(col, row, d) {
        const o = row & 1 ? DIRS[d].odd : DIRS[d].even;
        return [col + o[0], row + o[1]];
      }
      function dirBetween(a, b) {
        for (let d = 0; d < 6; d++) {
          const n = neighbor(a[0], a[1], d);
          if (n[0] === b[0] && n[1] === b[1]) return d;
        }
        return -1; // pas voisins
      }
      // offset (odd-r, lignes impaires à droite) -> cube, pour distance + tracé de ligne
      function toCube(col, row) {
        const x = col - (row - (row & 1)) / 2,
          z = row;
        return [x, -x - z, z];
      }
      function cubeDist(a, b) {
        return (
          (Math.abs(a[0] - b[0]) +
            Math.abs(a[1] - b[1]) +
            Math.abs(a[2] - b[2])) /
          2
        );
      }
      // chaîne d'hexes ADJACENTS de A (exclu) à B (inclus) — comble les sauts d'un drag rapide
      function hexWalk(a, b) {
        const out = [],
          cb = toCube(b[0], b[1]);
        let cur = a,
          guard = 0;
        while ((cur[0] !== b[0] || cur[1] !== b[1]) && guard++ < 300) {
          let best = 0,
            bestD = Infinity;
          for (let d = 0; d < 6; d++) {
            const n = neighbor(cur[0], cur[1], d),
              dist = cubeDist(toCube(n[0], n[1]), cb);
            if (dist < bestD) {
              bestD = dist;
              best = d;
            }
          }
          cur = neighbor(cur[0], cur[1], best);
          out.push(cur);
        }
        return out;
      }

      // tuiles d'arêtes indexées par masque : { mask -> [chemins variantes] }
      const ROAD_TILE = {},
        BRIDGE_TILE = {}, // ponts : même indexation par masque, jeu d'assets distinct
        RIVER_TILE = {};
      // jeu de rivières (63 masques complets, dossier assets/tiles/rivers)
      const RIVER_RAW = (CAT && CAT.rivers_raw) || [];
      (function buildEdgeTiles() {
        for (const p of CAT.roads_raw || []) {
          let m = /hexRoadBridge-(\d{6})-(\d+)\.png/.exec(p);
          if (m) {
            (BRIDGE_TILE[parseInt(m[1], 2)] ||= []).push(p);
            continue;
          }
          m = /hexRoad-(\d{6})-(\d+)\.png/.exec(p);
          if (m) (ROAD_TILE[parseInt(m[1], 2)] ||= []).push(p);
        }
        for (const p of RIVER_RAW) {
          const m = /hexRiver(\d{6})-(\d+)\.png/.exec(p);
          if (m) (RIVER_TILE[parseInt(m[1], 2)] ||= []).push(p);
        }
      })();
      // nombre de sorties (bits à 1) et test « ligne droite » (deux arêtes opposées)
      const popcount = (m) => {
        let n = 0;
        while (m) {
          n += m & 1;
          m >>= 1;
        }
        return n;
      };
      const isStraightMask = (m) =>
        m === 0b001001 || m === 0b010010 || m === 0b100100;
      // catégories du Road Catalog (mode manuel), dans l'ordre d'affichage
      const ROAD_CATS = [
        { title: "Single Exits", test: (m) => popcount(m) === 1 },
        { title: "Straight Roads", test: (m) => isStraightMask(m) },
        {
          title: "Corner Roads",
          test: (m) => popcount(m) === 2 && !isStraightMask(m),
        },
        { title: "3-Way Intersections", test: (m) => popcount(m) === 3 },
        { title: "4-Way Intersections", test: (m) => popcount(m) === 4 },
        { title: "5-Way Intersections", test: (m) => popcount(m) === 5 },
        { title: "6-Way Intersections", test: (m) => popcount(m) === 6 },
      ];
      function roadShapeLabel(mask) {
        const n = popcount(mask);
        if (n === 1) return "Single exit";
        if (n === 2) return isStraightMask(mask) ? "Straight" : "Corner";
        return n + "-way";
      }
      // config commune routes/rivières (outil ou mode de catalogue "roads"/"rivers")
      function edgeCfg(which) {
        const isRoad = which === "roads";
        return {
          isRoad,
          auto: isRoad ? "roadAuto" : "riverAuto", // clé du flag auto dans state
          brush: isRoad ? "roadBrush" : "riverBrush", // clé de la pièce choisie dans state
          layer: isRoad ? "road" : "river", // champ de masque sur la cellule
          tileMap: isRoad ? ROAD_TILE : RIVER_TILE,
          bridgeMap: isRoad ? BRIDGE_TILE : null,
          hasBridge: isRoad,
          title: isRoad ? "Road Catalog" : "River Catalog",
        };
      }
      // variante stable pour un (hex, masque) donné (pas de scintillement au re-rendu)
      function edgeTilePath(map, mask, col, row) {
        const arr = map[mask];
        if (!arr || !arr.length) return null;
        if (arr.length === 1) return arr[0];
        let h = (col * 73856093) ^ (row * 19349663) ^ (mask * 83492791);
        return arr[(h >>> 0) % arr.length];
      }

      // pose/retire une demi-arête sur un hex et rafraîchit son rendu
      function setEdgeBit(col, row, layer, bit, on) {
        const k = key(col, row),
          c = on ? getCell(k, true) : state.cells.get(k);
        if (!c) return;
        c[layer] = on
          ? (c[layer] || 0) | (1 << bit)
          : (c[layer] || 0) & ~(1 << bit);
        if (!on) pruneCell(k);
        updateCell(col, row);
      }
      // relie deux hexes voisins : bit côté A + bit opposé côté B
      function connectEdge(a, b, layer) {
        const d = dirBetween(a, b);
        if (d < 0) return;
        setEdgeBit(a[0], a[1], layer, d, true);
        setEdgeBit(b[0], b[1], layer, (d + 3) % 6, true);
      }
      // gomme : efface le masque de l'hex ET les demi-arêtes des voisins qui pointaient vers lui
      function eraseEdgeAt(col, row, layer) {
        for (let d = 0; d < 6; d++) {
          const n = neighbor(col, row, d),
            nc = state.cells.get(key(n[0], n[1]));
          if (nc && nc[layer]) setEdgeBit(n[0], n[1], layer, (d + 3) % 6, false);
        }
        const c = state.cells.get(key(col, row));
        if (c && c[layer]) {
          c[layer] = 0;
          if (layer === "road") c.roadBridge = 0;
          pruneCell(key(col, row));
          updateCell(col, row);
        }
      }

      /* =================== HISTORIQUE (undo/redo) =================== */
      const HIST_LIMIT = 30; // nombre d'étapes mémorisées
      let undoStack = [],
        redoStack = [],
        strokeBefore = null; // snapshot pris au début d'un tracé
      const snap = () => JSON.stringify(serialize());
      function pushUndo(prev) {
        undoStack.push(prev);
        if (undoStack.length > HIST_LIMIT) undoStack.shift();
        redoStack.length = 0; // toute nouvelle action efface le redo
      }
      function restoreSnap(str) {
        deserialize(JSON.parse(str)); // remplace les cellules + rend
        scheduleSave();
      }
      function undo() {
        if (!undoStack.length) return;
        redoStack.push(snap());
        restoreSnap(undoStack.pop());
      }
      function redo() {
        if (!redoStack.length) return;
        undoStack.push(snap());
        restoreSnap(redoStack.pop());
      }
      /* exécute une action ponctuelle en enregistrant l'état d'avant si ça change */
      function withHistory(fn) {
        const before = snap();
        fn();
        if (snap() !== before) pushUndo(before);
      }

      /* =================== PEINTURE =================== */
      let painting = false,
        stroke = new Set();
      function getCell(k, create) {
        let c = state.cells.get(k);
        if (!c && create) {
          c = { terrain: null, objects: [], road: 0, roadBridge: 0, river: 0 };
          state.cells.set(k, c);
        }
        return c;
      }
      function pruneCell(k) {
        const c = state.cells.get(k);
        if (c && !c.terrain && c.objects.length === 0 && !c.road && !c.river)
          state.cells.delete(k);
      }

      /* convertit la position d'un événement souris en coordonnées SVG (tient compte du zoom et du défilement) */
      function eventToSvg(e) {
        const svg = document.getElementById("svg");
        if (!svg || !svg.getScreenCTM) return null;
        const m = svg.getScreenCTM();
        if (!m) return null;
        const pt = svg.createSVGPoint();
        pt.x = e.clientX;
        pt.y = e.clientY;
        const p = pt.matrixTransform(m.inverse());
        return { x: p.x, y: p.y };
      }

      function applyAt(col, row, isClick, pt) {
        const k = key(col, row);
        if (state.tool === "roads" || state.tool === "rivers") {
          const layer = state.tool === "roads" ? "road" : "river";
          if (state.erase) {
            eraseEdgeAt(col, row, layer);
            state._lastHex = null;
            scheduleSave();
            return;
          }
          // mode manuel : on tamponne la pièce choisie telle quelle, sans auto-connexion
          const cfg = edgeCfg(state.tool);
          if (!state[cfg.auto]) {
            const b = state[cfg.brush];
            if (!b) return;
            const c = getCell(k, true);
            c[cfg.layer] = b.mask;
            if (cfg.isRoad) c.roadBridge = b.bridge ? b.mask : 0;
            updateCell(col, row);
            scheduleSave();
            return;
          }
          // premier hex du tracé : on mémorise, l'arête se pose dès qu'on entre dans un voisin
          if (isClick || !state._lastHex) {
            state._lastHex = [col, row];
            return;
          }
          const to = [col, row];
          if (to[0] !== state._lastHex[0] || to[1] !== state._lastHex[1]) {
            let prev = state._lastHex;
            for (const cur of hexWalk(prev, to)) {
              connectEdge(prev, cur, layer); // comble aussi les sauts du drag rapide
              prev = cur;
            }
            state._lastHex = to;
            scheduleSave();
          }
          return;
        }
        if (state.tool === "tiles") {
          if (state.erase) {
            const c = getCell(k);
            if (c) {
              c.terrain = null;
              pruneCell(k);
            }
          } else {
            if (!state.brushTile) return;
            const c = getCell(k, true),
              n = state.brushTile.variants.length;
            c.terrain = { id: state.brushTile.id, v: state.tileVar % n }; // pose la variante courante
            state.tileVar = (state.tileVar + 1) % n; // … puis avance automatiquement
            refreshTilePreview();
          }
        } else if (state.tool === "objects") {
          if (state.erase) {
            const c = getCell(k);
            if (c) {
              c.objects.pop();
              pruneCell(k);
            }
          } else {
            if (!state.brushObj) return;
            const c = getCell(k, true),
              n = state.brushObj.variants.length;
            const v = nextObjVar(state.brushObj); // variante pré-tirée (= celle du fantôme)
            if (state._pendingObjVar != null)
              state._pendingObjVar = (Math.random() * n) | 0; // re-tire pour le prochain
            if (isFull(state.brushObj) || !pt) {
              // objet plein-tuile : reste calé sur le hex
              c.objects.push({ id: state.brushObj.id, v });
            } else {
              // mode tampon : à l'endroit exact du clic
              const t = tileXY(col, row);
              c.objects.push({
                id: state.brushObj.id,
                v,
                ox: +(pt.x - t.x).toFixed(1),
                oy: +(pt.y - t.y).toFixed(1),
              });
            }
          }
        }
        updateCell(col, row);
        scheduleSave();
      }
      function clearCell(col, row) {
        state.cells.delete(key(col, row));
        updateCell(col, row);
        scheduleSave();
      }

      /* variante d'objet qui sera réellement posée (tirage différé en mode aléatoire,
         pour que le fantôme corresponde exactement au prochain placement) */
      function nextObjVar(it) {
        const n = it.variants.length;
        if (!state.objRandom) return Math.min(state.objVar, n - 1);
        if (state._pendingObjVar == null || state._pendingObjVar >= n)
          state._pendingObjVar = (Math.random() * n) | 0;
        return state._pendingObjVar;
      }

      /* aperçu translucide de la tuile/objet qui sera posé sous le curseur */
      function ghostMarkup(col, row) {
        const t = tileXY(col, row);
        if (state.erase) return ""; // pas d'aperçu en mode gomme
        if (state.tool === "tiles") {
          const it = state.brushTile;
          if (!it) return "";
          const p =
            it.variants[Math.min(state.tileVar, it.variants.length - 1)];
          return `<image href="${url(p)}" x="${t.x}" y="${t.y}" width="${TILE_W}" height="${TILE_H}"/>`;
        } else if (state.tool === "objects") {
          const it = state.brushObj;
          if (!it) return "";
          const p = it.variants[nextObjVar(it)];
          if (isFull(it))
            return `<image href="${url(p)}" x="${t.x}" y="${t.y}" width="${TILE_W}" height="${TILE_H}"/>`;
          const x = (t.x + 128 - it.w / 2).toFixed(1),
            y = (t.y + ANCHOR_Y - it.h).toFixed(1);
          return `<image href="${url(p)}" x="${x}" y="${y}" width="${it.w}" height="${it.h}"/>`;
        }
        return "";
      }
      function setGhost(col, row) {
        const g = document.getElementById("ghost");
        if (!g) return;
        g.innerHTML =
          painting || spaceHeld || panning2 ? "" : ghostMarkup(col, row);
      }
      function clearGhost() {
        const g = document.getElementById("ghost");
        if (g) g.innerHTML = "";
      }

      function bindCanvas() {
        document.querySelectorAll(".hit").forEach((el) => {
          const col = +el.dataset.col,
            row = +el.dataset.row;
          el.addEventListener("mousedown", (e) => {
            if (e.button !== 0) return;
            e.preventDefault();
            painting = true;
            strokeBefore = snap(); // état avant le tracé (groupe tout le glisser en 1 entrée)
            clearGhost();
            stroke = new Set([col + "," + row]);
            applyAt(col, row, true, eventToSvg(e));
          });
          el.addEventListener("mouseover", (e) => {
            if (painting) {
              if (!stroke.has(col + "," + row)) {
                stroke.add(col + "," + row);
                applyAt(col, row, false, eventToSvg(e));
              }
            } else if (
              state.tool === "tiles" ||
              (state.tool === "objects" &&
                state.brushObj &&
                isFull(state.brushObj))
            )
              setGhost(col, row);
          });
          el.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            withHistory(() => clearCell(col, row));
          });
        });
      }
      window.addEventListener("mouseup", () => {
        if (!painting) return;
        painting = false;
        if (state._lastHex) {
          state._lastHex = null;
          scheduleSave();
        }
        if (strokeBefore != null) {
          if (snap() !== strokeBefore) pushUndo(strokeBefore); // valide le tracé
          strokeBefore = null;
        }
      });

      /* =================== PANNEAUX =================== */
      /* icônes Lucide inlinées (stroke = currentColor, dimensionnées via .ic) */
      const ICONS = {
        eraser:
          '<path d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12.834 21"/><path d="m5.082 11.09 8.828 8.828"/>',
        shuffle:
          '<path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/>',
        download:
          '<path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/>',
        upload:
          '<path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>',
        image:
          '<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
        back: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
        trash:
          '<path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
      };
      const ic = (n) =>
        `<svg class="ic" viewBox="0 0 24 24">${ICONS[n] || ""}</svg>`;

      function renderPanel() {
        const p = document.getElementById("panel");
        // pied de panneau commun (toujours visible quel que soit l'outil)
        const footer = `<div class="spacer"></div><button class="danger" id="clearBtn">${ic("trash")} Tout effacer</button>`;
        // gomme (placée sous l'aperçu / sous l'option de variante) — même style que les options
        const erase = `<label class="opt"><input type="checkbox" id="eraseChk" ${state.erase ? "checked" : ""}> ${ic("eraser")} Gomme</label>`;
        if (state.tool === "tiles") {
          const it = state.brushTile;
          p.innerHTML = `<h2>Tuiles</h2>
      <div class="preview" id="catOpen">
        ${it ? `<img id="tilePrevImg" src="${url(it.variants[Math.min(state.tileVar, it.variants.length - 1)])}"><div class="nm">${it.name}</div><div class="sub">${it._group}${it.variants.length > 1 ? " · ×" + it.variants.length + " variantes" : ""}</div>` : '<div class="sub">Aucune tuile</div>'}
      </div>
      ${erase}
      ${footer}`;
          document.getElementById("catOpen").onclick = () =>
            openCatalog("tiles");
        } else if (state.tool === "objects") {
          const it = state.brushObj;
          const hasVariants = it && it.variants.length > 1;
          const selVar = state.objRandom ? -1 : state.objVar; // -1 = aucune (mode aléatoire)
          const prevSrc = it
            ? url(
                it.variants[
                  state.objRandom
                    ? 0
                    : Math.min(state.objVar, it.variants.length - 1)
                ],
              )
            : "";
          let vthumbs = "";
          if (hasVariants)
            vthumbs = `<div class="variants">${it.variants.map((v, i) => `<img class="${i === selVar ? "sel" : ""}" data-i="${i}" src="${url(v)}" title="variante ${i + 1}">`).join("")}</div>`;
          const randOpt = hasVariants
            ? `<label class="opt"><input type="checkbox" id="randChk" ${state.objRandom ? "checked" : ""}> ${ic("shuffle")} Variante aléatoire</label>`
            : "";
          p.innerHTML = `<h2>Objets</h2>
      <div class="preview" id="catOpen">
        ${it ? `<img src="${prevSrc}"><div class="nm">${it.name}</div><div class="sub">${it._group}${it.variants.length > 1 ? " · ×" + it.variants.length : ""}</div>` : '<div class="sub">Aucun objet</div>'}
      </div>
      ${vthumbs}
      ${randOpt}
      ${erase}
      ${footer}`;
          document.getElementById("catOpen").onclick = () =>
            openCatalog("objects");
          const rc = document.getElementById("randChk");
          if (rc)
            rc.onchange = (e) => {
              state.objRandom = e.target.checked;
              state._pendingObjVar = null; // nouveau tirage pour l'aperçu
              renderPanel();
            };
          // clic sur une vignette = choisir cette variante (et désactiver l'aléatoire)
          p.querySelectorAll(".variants img").forEach((im) => {
            im.onclick = () => {
              state.objVar = +im.dataset.i;
              state.objRandom = false;
              renderPanel();
            };
          });
        } else if (state.tool === "roads" || state.tool === "rivers") {
          const cfg = edgeCfg(state.tool);
          const auto = state[cfg.auto];
          // choix auto-connexion vs pose manuelle d'une pièce du catalogue
          const autoOpt = `<label class="opt"><input type="checkbox" id="edgeAutoChk" ${auto ? "checked" : ""}> ${ic("shuffle")} Automatique</label>`;
          const b = state[cfg.brush];

      /* =================== CATALOGUE (MODALE) =================== */

      const vpop = document.createElement("div");

      const VPOP_MAX = 7;
      function showVpop(card, it) {
        const shown = it.variants.slice(0, VPOP_MAX);

          `<div class="vgrid">` +

          (extra > 0 ? `<div class="vmore">+${extra}</div>` : "") +
          `</div>`;

        let top = cr.bottom + 8; // sous la card par défaut

      function openCatalog(mode) {

      function renderCatalog(q) {
        if (catalogMode === "roads" || catalogMode === "rivers")
          return renderEdgeCatalog(catalogMode);

        const groups = catalogMode === "tiles" ? CAT.tiles : CAT.objects;
        const selId =
          catalogMode === "tiles"
            ? state.brushTile && state.brushTile.id
            : state.brushObj && state.brushObj.id;
        let html = "";
        for (const g of groups) {
          const items = g.items.filter(
            (it) =>
              !it.hidden &&
              (!q ||
                it.name.toLowerCase().includes(q) ||
                it.id.toLowerCase().includes(q)),

          if (!items.length) continue;
          html += `<div class="mgroup"><h3>${g.group}</h3><div class="cards">`;
          for (const it of items) {
            html += `<div class="card${it.id === selId ? " sel" : ""}" data-id="${it.id}" title="${it.name} (${it.w}×${it.h})">
        <img loading="lazy" src="${url(it.variants[0])}">
        ${it.variants.length > 1 ? `<span class="badge">×${it.variants.length}</span>` : ""}
        <span class="lbl">${it.name}</span></div>`;

        body.querySelectorAll(".card").forEach((el) => {

      // Road/River Catalog (mode manuel) : une carte par masque, regroupées par nombre de sorties (+ ponts pour les routes)
      function renderEdgeCatalog(mode) {
        const cfg = edgeCfg(mode);
        const sel = state[cfg.brush];
        const card = (map, mask, bridge) => {
          const arr = map[mask];
          if (!arr || !arr.length) return "";
          const on =
            sel && sel.mask === mask && !!sel.bridge === bridge ? " sel" : "";
          return `<div class="card${on}" data-mask="${mask}" data-bridge="${bridge ? 1 : 0}" title="${bridge ? "Bridge" : roadShapeLabel(mask)}">
        <img loading="lazy" src="${url(arr[0])}">
        ${arr.length > 1 ? `<span class="badge">×${arr.length}</span>` : ""}</div>`;
        };
        let html = "";
        for (const cat of ROAD_CATS) {
          const masks = Object.keys(cfg.tileMap)
            .map(Number)
            .filter(cat.test)
            .sort((a, b) => a - b);
          if (!masks.length) continue;
          html += `<div class="mgroup"><h3>${cat.title}</h3><div class="cards">${masks
            .map((m) => card(cfg.tileMap, m, false))
            .join("")}</div></div>`;
        }
        if (cfg.hasBridge && cfg.bridgeMap) {
          const bMasks = Object.keys(cfg.bridgeMap)
            .map(Number)
            .sort((a, b) => a - b);
          if (bMasks.length)
            html += `<div class="mgroup"><h3>Bridges</h3><div class="cards">${bMasks
              .map((m) => card(cfg.bridgeMap, m, true))

          html || '<p style="color:var(--muted)">Aucune pièce.</p>';

          const arr = map && map[+el.dataset.mask];

            );
            el.addEventListener("mouseleave", hideVpop);
          }

        body.onscroll = hideVpop;

      function pickEdgeFromCatalog(mode, mask, bridge) {

      function toast(m) {

      function refreshTilePreview() {
        const im = document.getElementById("tilePrevImg");

      /* =================== ZOOM & DÉPLACEMENT =================== */
      const stage = document.querySelector(".stage");
      const ZOOM_MIN = 0.15,
        ZOOM_MAX = 1.1,
        ZOOM_SENS = 0.0022; // sensibilité du zoom (plus petit = plus lent/doux)

      /* zoom molette (Ctrl/Cmd/Shift + molette) - proportionnel, lissé et centré sur le curseur */
      stage.addEventListener(
        "wheel",
        (e) => {
          if (!e.ctrlKey && !e.metaKey && !e.shiftKey) return;
          e.preventDefault();
          const old = state.zoom;
          // delta normalisé (lignes -> pixels) puis plafonné pour éviter les à-coups d'une grosse molette
          let dy = e.deltaY * (e.deltaMode === 1 ? 16 : 1);
          dy = Math.max(-60, Math.min(60, dy));
          const factor = Math.exp(-dy * ZOOM_SENS); // zoom continu proportionnel à l'amplitude
          const next = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, old * factor));
          if (next === old) return;
          const svg = document.getElementById("svg"),
            vb = state._vb;
          if (!svg || !vb) return;
          const rect = stage.getBoundingClientRect();
          const cx = e.clientX - rect.left,
            cy = e.clientY - rect.top; // position du curseur dans la fenêtre
          const fx = (stage.scrollLeft + cx) / old,
            fy = (stage.scrollTop + cy) / old; // point sous le curseur (px SVG / zoom)
          state.zoom = next;
          // on redimensionne le SVG existant au lieu de tout reconstruire -> zoom fluide
          svg.setAttribute("width", (vb.w * next) | 0);
          svg.setAttribute("height", (vb.h * next) | 0);
          stage.scrollLeft = fx * next - cx; // garde ce point sous le curseur
          stage.scrollTop = fy * next - cy;
        },
        { passive: false },
      );

      /* déplacement : Espace + glisser (façon Photoshop) ou clic molette + glisser */
      let spaceHeld = false,
        panning2 = false,
        panOrigin = null;
      const isTyping = () => {
        const a = document.activeElement;
        return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA");
      };
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space" && !isTyping()) {
          if (!spaceHeld) {
            spaceHeld = true;
            stage.classList.add("pan-ready");
            clearGhost();
          }
          e.preventDefault();
        }
      });
      window.addEventListener("keyup", (e) => {
        if (e.code === "Space") {
          spaceHeld = false;
          stage.classList.remove("pan-ready");
        }
      });
      stage.addEventListener("mousedown", (e) => {
        if (e.button !== 1 && !(spaceHeld && e.button === 0)) return; // clic molette OU Espace+clic gauche
        e.preventDefault();
        panning2 = true;
        clearGhost();
        panOrigin = {
          x: e.clientX,
          y: e.clientY,
          sl: stage.scrollLeft,
          st: stage.scrollTop,
        };
        stage.classList.add("panning");
      });
      stage.addEventListener("mouseleave", clearGhost);
      /* aperçu d'objet (non plein) qui suit le curseur en mode tampon */
      stage.addEventListener("mousemove", (e) => {
        if (
          state.tool !== "objects" ||
          state.erase ||
          painting ||
          spaceHeld ||
          panning2
        )
          return;
        const it = state.brushObj;
        if (!it || isFull(it)) return; // les objets pleins gardent l'aperçu cellulaire
        const g = document.getElementById("ghost");
        if (!g) return;
        const p = eventToSvg(e);
        if (!p) return;
        const path = it.variants[nextObjVar(it)];
        const x = (p.x - it.w / 2).toFixed(1),
          y = (p.y - it.h).toFixed(1);
        g.innerHTML = `<image href="${url(path)}" x="${x}" y="${y}" width="${it.w}" height="${it.h}"/>`;
      });
      window.addEventListener("mousemove", (e) => {
        if (!panning2) return;
        stage.scrollLeft = panOrigin.sl - (e.clientX - panOrigin.x);
        stage.scrollTop = panOrigin.st - (e.clientY - panOrigin.y);
      });
      window.addEventListener("mouseup", () => {
        if (panning2) {
          panning2 = false;
          stage.classList.remove("panning");
        }
      });

      /* =================== PERSISTANCE =================== */
      function serialize() {
        const cells = [];
        for (const [k, c] of state.cells) {
          const cell = {
            t: c.terrain ? [c.terrain.id, c.terrain.v] : null,
            o: c.objects.map((o) =>
              o.ox != null ? [o.id, o.v, o.ox, o.oy] : [o.id, o.v],
            ),
          };
          if (c.road) cell.r = c.road; // masque d'arêtes route
          if (c.roadBridge) cell.rb = c.roadBridge; // route = pont (jeu d'assets distinct)
          if (c.river) cell.w = c.river; // masque d'arêtes rivière
          cells.push([k, cell]);
        }
        return { cols: state.cols, rows: state.rows, cells };
      }
      function deserialize(d) {
        state.cols = d.cols || 60;
        state.rows = d.rows || 44;
        state._lastHex = null;
        state.cells = new Map();
        for (const [k, c] of d.cells || []) {
          const terrain =
            c.t && TILES_BY_ID.has(c.t[0])
              ? { id: c.t[0], v: c.t[1] || 0 }
              : null;
          const objects = (c.o || [])
            .filter((o) => OBJ_BY_ID.has(o[0]))
            .map((o) =>
              o.length > 2
                ? { id: o[0], v: o[1] || 0, ox: o[2], oy: o[3] }
                : { id: o[0], v: o[1] || 0 },
            );
          state.cells.set(k, {
            terrain,
            objects,
            road: c.r || 0,
            roadBridge: c.rb || 0,
            river: c.w || 0,
          });
        }
        render();
      }
      let saveTimer = null;
      function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          try {
            localStorage.setItem("hexeditor2", JSON.stringify(serialize()));
          } catch (e) {}
        }, 400);
      }
      function saveMap() {
        const blob = new Blob([JSON.stringify(serialize())], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "hexmap.json";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        toast("Carte enregistrée ✓");
      }
      function loadMap() {
        const inp = document.createElement("input");
        inp.type = "file";
        inp.accept = ".json";
        inp.onchange = () => {
          const f = inp.files[0];
          if (!f) return;
          const fr = new FileReader();
          fr.onload = () => {
            try {
              const data = JSON.parse(fr.result);
              withHistory(() => {
                deserialize(data);
                scheduleSave();
              });
              toast("Chargée ✓");
            } catch (e) {
              toast("Fichier invalide");
            }
          };
          fr.readAsText(f);
        };
        inp.click();
      }
      function exportPNG(foundry) {
        const EXPORT_MARGIN = 64; // marge autour du contenu (px)
        // mode "Foundry VTT" : étire verticalement pour rendre les hexagones réguliers
        // (compatibles avec une grille "Hex Rows", size = 256)
        const SY = foundry ? 2 / Math.sqrt(3) : 1;
        // liste de dessin, dans le même ordre que le rendu (terrain puis objets, par ligne/colonne)
        // hex:true => tuile pleine (silhouette d'hexagone, donc bornes visibles plus serrées que le rectangle)
        const draws = [];
        let minCol = Infinity,
          maxCol = -Infinity,
          minRow = Infinity,
          maxRow = -Infinity;
        for (let row = 0; row < state.rows; row++)
          for (let col = 0; col < state.cols; col++) {
            const c = state.cells.get(key(col, row));
            if (!c || (!c.terrain && !c.objects.length)) continue;
            if (col < minCol) minCol = col;
            if (col > maxCol) maxCol = col;
            if (row < minRow) minRow = row;
            if (row > maxRow) maxRow = row;
            const t = tileXY(col, row);
            if (c.terrain) {
              const p = terrainPath(c.terrain);
              if (p) {
                // socle 2.5D derrière la tuile (pas en export Foundry : casserait la grille top-down)
                if (!foundry) {
                  const u = underFor(c.terrain);
                  if (u)
                    draws.push({
                      src: u,
                      x: t.x,
                      y: t.y + UNDER_DY,
                      w: UNDER_W,
                      h: UNDER_H,
                    });
                }
                draws.push({
                  src: p,
                  x: t.x,
                  y: t.y,
                  w: TILE_W,
                  h: TILE_H,
                  hex: true,
                });
              }
            }
            for (const o of c.objects) {
              const r = objItemVar(o);
              if (!r) continue;
              if (isFull(r.it))
                draws.push({
                  src: r.path,
                  x: t.x,
                  y: t.y,
                  w: TILE_W,
                  h: TILE_H,
                  hex: true,
                });
              else {
                const ox = o.ox != null ? o.ox : 128,
                  oy = o.oy != null ? o.oy : ANCHOR_Y;
                draws.push({
                  src: r.path,
                  x: t.x + ox - r.it.w / 2,
                  y: t.y + oy - r.it.h,
                  w: r.it.w,
                  h: r.it.h,
                });
              }
            }
          }
        if (!draws.length) {
          toast("Carte vide");
          return;
        }
        // boîte englobante du contenu visible (silhouette hex pour les tuiles : y ∈ [124, 383], x ∈ [0, 256])
        let minX = Infinity,
          minY = Infinity,
          maxX = -Infinity,
          maxY = -Infinity;
        for (const d of draws) {
          const x0 = d.hex ? d.x : d.x,
            x1 = d.hex ? d.x + 256 : d.x + d.w,
            y0 = d.hex ? d.y + 124 : d.y,
            y1 = d.hex ? d.y + 383 : d.y + d.h;
          if (x0 < minX) minX = x0;
          if (y0 < minY) minY = y0;
          if (x1 > maxX) maxX = x1;
          if (y1 > maxY) maxY = y1;
        }
        let cropX, cropY, w, h;
        if (foundry) {
          // recadrage aligné sur la trame hexagonale -> colle à une grille Foundry "Hex Rows (Odd)",
          // size 256, offset (0,0), sans avoir à bouger la grille
          const PAD = 2; // marge en hexagones entiers (assez pour les objets qui dépassent en haut)
          let c0 = minCol - PAD,
            c1 = maxCol + PAD,
            r0 = minRow - PAD,
            r1 = maxRow + PAD;
          if (r0 & 1) r0 -= 1; // ligne du haut non décalée => parité "Odd" garantie
          cropX = c0 * COL; // bord gauche = bord gauche d'un hex de ligne paire
          cropY = r0 * ROW + 124; // bord haut = sommet de l'hex (haut de sa boîte englobante)
          w = c1 * COL + XOFF + TILE_W - cropX; // couvre le décalage des lignes impaires à droite
          h = r1 * ROW + 383 - cropY;
          // calage mesuré sur Foundry (la grille n'ancre pas son hex (0,0) pile en haut-gauche).
          // X = 128px (demi-hex, parité) ; Y = 3px en pixels Foundry -> reconverti en espace tuile (÷ SY).
          cropX += 128;
          cropY += 3 / SY;
        } else {
          cropX = Math.floor(minX - EXPORT_MARGIN);
          cropY = Math.floor(minY - EXPORT_MARGIN);
          w = Math.ceil(maxX + EXPORT_MARGIN) - cropX;
          h = Math.ceil(maxY + EXPORT_MARGIN) - cropY;
        }
        // précharge les images uniques (déjà en cache navigateur), puis dessine sur le canvas
        const uniq = [...new Set(draws.map((d) => d.src))];
        const imgs = {};
        let loaded = 0,
          failed = 0;
        const finish = () => {
          const cv = document.createElement("canvas");
          cv.width = w;
          cv.height = Math.round(h * SY);
          const ctx = cv.getContext("2d");
          ctx.fillStyle = "#10141a";
          ctx.fillRect(0, 0, cv.width, cv.height);
          if (SY !== 1) ctx.scale(1, SY); // étirement vertical (mode Foundry)
          for (const d of draws) {
            const im = imgs[d.src];
            if (im && im.naturalWidth)
              ctx.drawImage(im, d.x - cropX, d.y - cropY, d.w, d.h);
          }
          try {
            cv.toBlob((b) => {
              const a = document.createElement("a");
              a.href = URL.createObjectURL(b);
              a.download = foundry ? "hexmap-foundry.png" : "hexmap.png";
              a.click();
              setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            }, "image/png");
            const note = foundry ? " — grille Hex Rows, size 256" : "";
            toast(
              failed
                ? `PNG exporté (${failed} image(s) non chargée(s))`
                : "PNG exporté ✓" + note,
            );
          } catch (e) {
            // canvas "tainted" : arrive surtout en file:// — un serveur local règle ça
            toast("Export bloqué : lance l'éditeur via un serveur local");
          }
        };
        uniq.forEach((src) => {
          const im = new Image();
          im.onload = im.onerror = () => {
            if (!im.naturalWidth) failed++;
            if (++loaded === uniq.length) finish();
          };
          im.src = url(src);
          imgs[src] = im;
        });
      }

      /* =================== INIT =================== */
      setTool("tiles");
      document.getElementById("gridBtn").classList.add("active");
      const saved = localStorage.getItem("hexeditor2");
      if (saved) {
        try {
          deserialize(JSON.parse(saved));
        } catch (e) {
          render();
        }
      } else render();

      /* centre la vue sur un hexagone (centre du hex au centre du viewport) */
      function centerOnHex(col, row) {
        if (!state._vb) return;
        const t = tileXY(col, row);
        const px = (t.x + 128 - state._vb.x) * state.zoom; // centre horizontal du hex
        const py = (t.y + 254 - state._vb.y) * state.zoom; // centre vertical du hex (≈ (124+383)/2)
        stage.scrollLeft = px - stage.clientWidth / 2;
        stage.scrollTop = py - stage.clientHeight / 2;
      }
      const centerMap = () =>
        centerOnHex(Math.floor(state.cols / 2), Math.floor(state.rows / 2));

      /* raccourci C : centrer sur l'hex du milieu de la carte */
      window.addEventListener("keydown", (e) => {
        if (isTyping() || e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key === "c" || e.key === "C") centerMap();
      });

      /* Ctrl/Cmd+Z = annuler · Ctrl/Cmd+Shift+Z ou Ctrl/Cmd+Y = rétablir */
      window.addEventListener("keydown", (e) => {
        if (!(e.ctrlKey || e.metaKey) || isTyping()) return;
        const k = e.key.toLowerCase();
        if (k === "z") {
          e.preventDefault();
          e.shiftKey ? redo() : undo();
        } else if (k === "y") {
          e.preventDefault();
          redo();
        }
      });

      /* au chargement : on arrive centré sur le milieu de la carte */
      centerMap();
    </script>
  </body>
</html>
